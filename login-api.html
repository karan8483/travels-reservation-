<!DOCTYPE html>
<html>
<head>
  <title>Login - Travel Reservation</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .error-notice {
      background-color: #fee;
      border-left: 4px solid #f00;
      padding: 10px 15px;
      margin: 10px 0;
      color: #c33;
    }
  </style>
</head>
<body>
  <nav>
    <div class="nav-container">
      <h1>Travel Reservation</h1>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="search.html">Search</a></li>
        <li id="loginLink"><a href="login.html">Login</a></li>
        <li id="logoutLink"><a href="#" onclick="logout(); return false;">Logout</a></li>
        <li id="authEmail" style="display:none;"></li>

    <div class="form-container">

      </form>
      <p>Don't have an account? <a href="register-api.html">Register here</a></p>
      
      <div style="margin-top: 30px; padding-top: 20px; border-top: 1px solid #ddd;">

        <p><strong>Email:</strong> admin@example.com</p>
        <p><strong>Password:</strong> admin123</p>
        <p style="font-size: 12px; color: #666;">Create an admin account via API or use this for demo purposes.</p>
      </div>
    </div>
  </div>

  <script src="js/auth-api.js"></script>
</body>
</html>
