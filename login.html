<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Travel Reservation</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .error-notice {
      background-color: #fee;
      border-left: 4px solid #f00;
      padding: 10px 15px;
      margin: 10px 0;
      color: #c33;
    }
    .success-notice {
      background-color: #efe;
      border-left: 4px solid #0f0;
      padding: 10px 15px;
      margin: 10px 0;
      color: #3c3;
    }
  </style>
</head>

<body>
  <!-- Navigation Header -->
  <header>
    <div class="nav">
      <a class="logo" href="index.html">🚌 SK <span>Tours & Travel</span></a>
      <nav>
        <a href="index.html">Home</a>
        <a href="search.html">Search</a>
        <a id="loginLink" href="login.html">Login</a>
        <a href="register.html">Register</a>
        <a href="admin.html">Admin</a>
      </nav>
      <div class="auth-box">
        <div id="authEmail" class="auth-email" style="display: none;"></div>
        <a id="logoutLink" class="auth-logout" href="#" onclick="event.preventDefault(); logout();" style="display: none;">Logout</a>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="container">
    <div class="form-container">
      <h2>Login</h2>
      <div id="msg"></div>

      <form id="loginForm">
        <div class="form-group">
          <input type="email" id="email" placeholder="Email" required>
        </div>
        <div class="form-group">
          <input type="password" id="password" placeholder="Password" required>
        </div>
        <button type="submit" class="btn">Login</button>
      </form>

      <p>Don't have an account? <a href="register.html">Register here</a></p>
    </div>
  </main>

  <!-- Scripts -->
  <script src="js/app.js"></script>
  <script src="js/auth.js"></script>
</body>

</html>
