<!DOCTYPE html>
<html>
<head>
  <title>Register - Travel Reservation</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .error-notice {
      background-color: #fee;
      border-left: 4px solid #f00;
      padding: 10px 15px;
      margin: 10px 0;
      color: #c33;
    }
  </style>
</head>
<body>
  <nav>
    <div class="nav-container">
      <h1>Travel Reservation</h1>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="search.html">Search</a></li>
        <li id="loginLink"><a href="login.html">Login</a></li>
        <li id="logoutLink"><a href="#" onclick="logout(); return false;">Logout</a></li>
        <li id="authEmail" style="display:none;"></li>
      </ul>
    </div>
  </nav>

  <div class="container">
    <div class="form-container">
      <h2>Register</h2>
      <div id="msg"></div>
      <form id="registerForm">
        <input type="text" id="name" placeholder="Full Name" required>
        <input type="email" id="email" placeholder="Email" required>
        <input type="password" id="password" placeholder="Password" required>
        <input type="password" id="confirmPassword" placeholder="Confirm Password" required>
        <button type="submit">Register</button>
      </form>
      <p>Already have an account? <a href="login.html">Login here</a></p>
    </div>
  </div>

  <script src="js/auth-api.js"></script>
</body>
</html>
