<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - Travel Reservation</title>
  <link rel="stylesheet" href="css/style.css">
</head>

<body>
  <!-- Navigation Header -->
  <header>
    <div class="nav">
      <a class="logo" href="index.html">🚌 SK <span>Tours & Travel</span></a>
      <nav>
        <a href="index.html">Home</a>
        <a href="search.html">Search</a>
        <a id="loginLink" href="login.html">Login</a>
        <a href="register.html">Register</a>
        <a href="admin.html">Admin</a>
      </nav>
      <div class="auth-box">
        <div id="authEmail" class="auth-email" style="display: none;"></div>
        <a id="logoutLink" class="auth-logout" href="#" onclick="event.preventDefault(); logout();" style="display: none;">Logout</a>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="container">
    <div class="form-container">
      <h2>Register</h2>
      <div id="msg"></div>

      <form id="registerForm">
        <div class="form-group">
          <input type="text" id="name" placeholder="Full Name" required>
        </div>
        <div class="form-group">
          <input type="email" id="email" placeholder="Email" required>
        </div>
        <div class="form-group">
          <input type="password" id="password" placeholder="Password" required>
        </div>
        <div class="form-group">
          <input type="password" id="confirmPassword" placeholder="Confirm Password" required>
        </div>
        <button type="submit" class="btn">Register</button>
      </form>

      <p>Already have an account? <a href="login.html">Login here</a></p>
    </div>
  </main>

  <!-- Scripts -->
  <script src="js/app.js"></script>
  <script src="js/auth.js"></script>
</body>

</html>
